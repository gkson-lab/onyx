<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Onyx 1</title>
	<style>
		:root {
			--paper: #f6f3f2;
			--surface: #ffffff;
			--ink: #1d1716;
			--muted: #6c605d;
			--line: #e2d9d6;
			--edge: #8a7d79;
			--signal: #c4242b;
			color-scheme: light;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--paper: #120e0d;
				--surface: #1b1514;
				--ink: #f1e9e7;
				--muted: #a3928e;
				--line: #2f2523;
				--edge: #7a6a66;
				--signal: #ff4a4f;
				color-scheme: dark;
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font: 16px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
		}
		main {
			display: grid;
			grid-template-rows: auto 1fr auto;
			max-width: 720px;
			height: 100dvh;
			margin: 0 auto;
			padding: 0 16px;
		}
		header { padding: 24px 0 12px; border-bottom: 1px solid var(--line); }
		h1 { margin: 0; font-size: 1.6rem; }
		header p { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
		#log { overflow-y: auto; padding: 16px 0; }
		.msg { margin: 0 0 14px; animation: in 220ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
		.who { font-size: 0.75rem; font-weight: 650; color: var(--muted); margin-bottom: 2px; }
		.you { text-align: right; }
		.you .body { display: inline-block; text-align: left; padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
		.body code { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; }
		.body ul { margin: 6px 0; padding-left: 20px; }
		form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--line); }
		input {
			flex: 1;
			min-height: 44px;
			padding: 0 12px;
			border: 1px solid var(--edge);
			border-radius: 8px;
			background: var(--surface);
			color: var(--ink);
			font: inherit;
		}
		button {
			min-height: 44px;
			padding: 0 16px;
			border: 0;
			border-radius: 8px;
			background: var(--signal);
			color: #fff;
			font: inherit;
			font-weight: 650;
			cursor: pointer;
		}
		:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
		@keyframes in { from { opacity: 0; transform: translateY(6px); } }
		@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Onyx 1</h1>
			<p>Omni Agent's local engine, running on its own: everything happens in this page, with no network. Try "hi", "what is 12 times 7", "spell onyx" or "what is a JWT".</p>
		</header>
		<div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
		<form id="form">
			<input id="text" autocomplete="off" aria-label="Message to Onyx" placeholder="Say something to Onyx">
			<button type="submit">Send</button>
		</form>
	</main>
	<script src="../host/host.js"></script>
	<script src="../src/onyx-math.js"></script>
	<script src="../src/onyx-data.js"></script>
	<script src="../src/onyx.js"></script>
	<script>
		(function () {
			'use strict';
			const log = document.getElementById('log');
			const form = document.getElementById('form');
			const input = document.getElementById('text');
			const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
			// Just enough Markdown for Onyx's replies: bold, code, bullet lists and line breaks.
			function render(text) {
				const lines = escape(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').split('\n');
				let html = '';
				let list = false;
				for (const line of lines) {
					if (/^- /.test(line)) {
						if (!list) html += '<ul>';
						list = true;
						html += '<li>' + line.slice(2) + '</li>';
						continue;
					}
					if (list) html += '</ul>';
					list = false;
					html += line ? line + '<br>' : '<br>';
				}
				return html + (list ? '</ul>' : '');
			}
			function add(who, text, mine) {
				const el = document.createElement('div');
				el.className = 'msg' + (mine ? ' you' : '');
				el.innerHTML = '<div class="who">' + who + '</div><div class="body">' + (mine ? escape(text) : render(text)) + '</div>';
				log.appendChild(el);
				log.scrollTop = log.scrollHeight;
			}
			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				const text = input.value.trim();
				if (!text) return;
				input.value = '';
				add('You', text, true);
				const r = await Omni.onyx.respond(text);
				if (!r) return;
				const reply = r.command ? 'That is a command for OmniTool\'s tools, which only run inside OmniTool.' : r.text + (r.offer ? '\n\n' + r.offer.ask : '');
				add('Onyx', reply || 'Okay.');
			});
			input.focus();
		})();
	</script>
</body>
</html>
